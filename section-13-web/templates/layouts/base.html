<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>

{{template "header.html" .}}

<body>
    <main>
        {{with .Flash}}
        <div class="flash">
            <p>{{ . }}</p>
        </div>
        {{end}}
        {{template "content" .}}
    </main>

    {{template "footer.html" .}}
</body>

</html>
