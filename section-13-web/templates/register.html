{{define "content"}}
<div class="page-container glass-effect fade-in">
    <h1 class="anime-title">Register</h1>
    
    {{if .Error}}
    <div style="color: var(--neon-pink); margin-bottom: 15px; text-align: center;">{{ .Error }} </div>
    {{end}}

    <form action="/register" method="post" acceptcharset="UTF-8" class="form">
        <div class="input-group">
            <label for="username">Name :</label>
            <input type="text" id="username" value="{{.Username}}" required>
        </div>

        <div class="input-group">
            <label for="email">Email :</label>
            <input type="email" id="email" value="{{.Email}}" required>
        </div>

        <div class="input-group">
            <label for="password">Password :</label>
            <input type="password" id="password" value="{{.Password}}" required>
        </div>

        <div class="input-group">
            <label for="confirm_password">Confirm Password :</label>
            <input type="password" id="confirm_password" value="{{.ConfirmPassword}}" required>
        </div>

        <button type="submit" class="glow-button"> Register </button>
    </form>

    <p style="margin-top: 20px;">
        Already have an ID? 
        <a href="/login"> Login here </a>
    </p>
</div>
{{end}}
