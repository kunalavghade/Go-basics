{{define "content"}}
<h1>Regiter Page</h1>
{{if .Error}}
<div>{{ .Error }} </div>
{{end}}

<form action="/register" method="post" acceptcharset="UTF-8" class="form">
    <label for="name">Name :</label>
    <input type="text" id="username" value="{{.Username}}" required>

    <label for="email">Email :</label>
    <input type="email" id="email" value="{{.Email}}" required>

    <label for="password">Password :</label>
    <input type="password" id="password" value="{{.Password}}" required>

    <label for="confirm_password">Confirm Password :</label>
    <input type="password" id="confirm_password" value="{{.ConfirmPassword}}" required>

    <button type="submit"> Register </button>
</form>

<p>
    Already have an id Then Login
    <a href="/login"> Login here </a>
</p>

{{end}}
