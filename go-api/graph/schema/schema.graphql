directive @auth on FIELD_DEFINITION

type Query {
  # User Queries
  me: User! @auth

  # Category Queries (Public)
  categories: [Category!]!
  category(id: ID!): Category!

  # Product Queries (Public)
  products(page: Int, limit: Int): [Product!]!
  product(id: ID!): Product!

  # Cart Queries (Protected)
  cart: Cart! @auth

  # Order Queries (Protected)
  orders: [Order!]! @auth
  order(id: ID!): Order! @auth
}

type Mutation {
  # Auth Mutations (Public - accessible without login)
  register(input: RegisterInput!): AuthenticationResponse!
  login(input: LoginInput!): AuthenticationResponse!
  refreshToken(input: RequestTokenInput!): AuthenticationResponse!

  # User Profile & Session (Protected)
  logout(refreshToken: String!): Boolean! @auth
  updateProfile(input: UpdateProfileInput!): User! @auth

  # Category Mutations (Protected)
  createCategory(input: CreateCategoryInput!): Category! @auth
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category! @auth
  deleteCategory(id: ID!): Boolean! @auth

  # Product Mutations (Protected)
  createProduct(input: CreateProductInput!): Product! @auth
  updateProduct(id: ID!, input: UpdateProductInput!): Product! @auth
  deleteProduct(id: ID!): Boolean! @auth

  # Cart Mutations (Protected)
  addToCart(input: AddToCartInput!): Cart! @auth
  updateCart(input: UpdateCartInput!): Cart! @auth
  removeFromCart(input: RemoveFromCartInput!): Cart! @auth

  # Order Mutations (Protected)
  createOrder: Order! @auth
}