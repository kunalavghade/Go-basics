type Query {
  # User Queries
  me: User!

  # Category Queries
  categories: [Category!]!
  category(id: ID!): Category!

  # Product Queries
  products(page: Int, limit: Int): [Product!]!
  product(id: ID!): Product!

  # Cart Queries
  cart: Cart!

  # Order Queries
  orders: [Order!]!
  order(id: ID!): Order!
}

type Mutation {
  # Auth Mutations
  register(input: RegisterInput!): AuthenticationResponse!
  login(input: LoginInput!): AuthenticationResponse!
  refreshToken(input: RequestTokenInput!): AuthenticationResponse!
  logout(refreshToken: String!): Boolean!
  updateProfile(input: UpdateProfileInput!): User!

  # Category Mutations
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!

  # Product Mutations
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  deleteProduct(id: ID!): Boolean!

  # Cart Mutations
  addToCart(input: AddToCartInput!): Cart!
  updateCart(input: UpdateCartInput!): Cart!
  removeFromCart(input: RemoveFromCartInput!): Cart!

  # Order Mutations
  createOrder: Order!
}